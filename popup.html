<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>解放 · 申请表自动填写</title>
  <link rel="stylesheet" href="src/ui/design-tokens.css">
  <link rel="stylesheet" href="src/ui/popup.css">
</head>
<body>
  <header class="header">
    <div class="brand"><span class="mark" aria-hidden="true">解</span><div class="brand-copy"><div class="brand-line"><h1>解放</h1><span class="badge" id="task-state" role="status" aria-live="polite">连接中</span></div><p class="subtitle">申请表自动填写 · 本地处理</p></div></div>
    <button class="icon-button" id="btn-advanced" type="button" aria-label="高级功能" aria-haspopup="menu" aria-controls="advanced-menu" aria-expanded="false"><span data-icon="more" aria-hidden="true"></span></button>
    <div class="advanced-menu" id="advanced-menu" role="menu" aria-label="高级功能" hidden>
      <p class="menu-label">高级功能</p>
      <button id="btn-scan" type="button" role="menuitem"><span data-icon="refresh"></span>重新检查页面</button>
      <button id="btn-diagnose" type="button" role="menuitem"><span data-icon="settings"></span>兼容性诊断</button>
      <button id="btn-copy-diagnosis" type="button" role="menuitem" disabled><span data-icon="copy"></span>复制诊断 JSON</button>
      <button id="btn-download-diagnosis" type="button" role="menuitem" disabled><span data-icon="download"></span>下载诊断 JSON</button>
      <div id="diagnosis-actions" class="diagnosis-note" hidden><p id="diagnosis-summary"></p></div>
      <div class="menu-divider" role="separator"></div>
      <button id="btn-options" type="button" role="menuitem"><span data-icon="settings"></span>管理申请资料</button>
      <button id="btn-materials" type="button" role="menuitem"><span data-icon="folder"></span>材料库</button>
      <button id="btn-about" type="button" role="menuitem"><span data-icon="info"></span>关于解放</button>
    </div>
  </header>
  <main>
    <section class="current-page" aria-labelledby="system-name">
      <span class="page-icon" data-icon="globe" aria-hidden="true"></span>
      <div class="page-copy"><p class="eyebrow">当前申请页面</p><h2 id="system-name">正在连接当前页面</h2><div class="system-section" id="system-section">读取页面信息…</div><p class="system-meta" id="system-meta" aria-live="polite">准备检查可填写内容</p></div>
      <span class="scan-badge" id="system-badge">连接中</span>
    </section>
    <section class="readiness" id="readiness" aria-labelledby="readiness-title">
      <div class="section-head"><h2 id="readiness-title">我的申请资料</h2><span class="coverage-label" id="profile-coverage">资料覆盖度 —</span></div>
      <div class="profile" id="profile-name">正在读取本地资料…</div>
      <div class="progress coverage-progress" role="progressbar" aria-label="申请资料字段覆盖度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="coverage-meter"><i id="coverage-progress-bar"></i></div>
      <p class="help">按已维护的申请资料字段统计</p>
      <div class="stats" id="resume-stats" aria-label="资料统计"></div>
      <button class="text-button" id="btn-create-profile" type="button" hidden>添加我的申请资料<span data-icon="chevron-right" aria-hidden="true"></span></button>
    </section>
    <section class="task-summary" id="task-summary" aria-labelledby="task-title" hidden>
      <div class="section-head"><h2 id="task-title">任务进度</h2><span id="task-progress">尚未开始</span></div>
      <div class="progress" id="task-meter" role="progressbar" aria-label="填写任务进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="task-progress-bar"></i></div>
      <p class="task-section" id="task-section">核对预览后开始填写</p>
      <p class="task-note" id="task-note">填写前会请你确认，不会自动提交。</p>
    </section>
    <section class="actions" aria-label="当前任务操作">
      <button class="primary" id="btn-run-all" type="button"><span data-icon="play" aria-hidden="true"></span>检查并开始填写</button>
      <button class="primary" id="btn-pause" type="button" hidden><span data-icon="pause" aria-hidden="true"></span>暂停</button>
      <button class="primary" id="btn-resume" type="button" hidden><span data-icon="play" aria-hidden="true"></span>继续</button>
      <button class="primary" id="btn-review" type="button" hidden><span data-icon="alert" aria-hidden="true"></span>处理待确认项</button>
      <button class="primary" id="btn-result" type="button" hidden><span data-icon="check" aria-hidden="true"></span>查看填写结果</button>
      <button class="primary" id="btn-problem" type="button" hidden><span data-icon="alert" aria-hidden="true"></span>查看问题</button>
      <button id="btn-run-current" type="button"><span data-icon="globe" aria-hidden="true"></span>仅填写当前页</button>
      <button id="btn-panel" type="button"><span data-icon="panel" aria-hidden="true"></span>打开网页助手</button>
      <button class="danger" id="btn-stop" type="button" hidden><span data-icon="stop" aria-hidden="true"></span>停止</button>
      <button id="btn-skip" type="button" hidden><span data-icon="chevron-right" aria-hidden="true"></span>跳过</button>
      <button id="btn-rescan" type="button" hidden><span data-icon="refresh" aria-hidden="true"></span>重新检查</button>
    </section>
    <section class="review-summary" aria-labelledby="review-title">
      <div class="section-head"><h2 id="review-title">需要处理</h2><span class="review-count" id="review-count">0 项</span></div>
      <div id="review-list"><p class="empty">当前没有需要处理的项目</p></div>
      <button class="text-button review-all" id="btn-review-all" type="button" hidden>查看全部<span data-icon="chevron-right" aria-hidden="true"></span></button>
    </section>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>
  <footer class="footer"><span data-icon="shield" aria-hidden="true"></span>本地处理 · 不自动提交</footer>
  <dialog id="about-dialog" aria-modal="true" aria-labelledby="about-title"><div class="section-head"><h2 id="about-title">关于解放</h2><button class="icon-button" id="btn-close-about" type="button" aria-label="关闭关于解放"><span data-icon="close" aria-hidden="true"></span></button></div><p>申请表自动填写助手</p><p class="help">基于 JobFill 二次开发 · MIT License</p><p class="help">数据与材料仅保存在本机浏览器。仅在当前页面本地处理，不会自动提交。</p><p class="help" id="about-version"></p></dialog>
  <script src="src/ui/design-system.js"></script>
  <script src="src/ui/profile-coverage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
